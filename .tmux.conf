# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

set-option -g status-position top

set-option -g repeat-time 0

set -g default-terminal "xterm-256color"
set -g default-command "bash"
set -ga terminal-overrides ",*256col*:Tc"

# Removes ESC delay
set -sg escape-time 0

# ======= Plugin management =====

# Install Tmux Plugin Manager if not already existing
if "test ! -d ~/.tmux/plugins/tpm" \
       "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# List of plugins
# set -g @plugin 'caiogondim/maglev'
# set -g @plugin 'arcticicestudio/nord-tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @plugin 'xamut/tmux-weather'
set-option -g @tmux-weather-location "Sydney"
set-option -g status-right "#{weather}"

set -g @plugin 'catppuccin/tmux#v2.3.2'    # pinned, so the config can't drift again

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_number_color "#{@thm_blue}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# windows: rounded left cap on the number block
set -g @catppuccin_window_left_separator "#[fg=#{@_ctp_status_bg},reverse]\ue0b6#[none] "
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_current_left_separator "#{@catppuccin_window_left_separator}"
set -g @catppuccin_window_current_middle_separator " "

# inactive windows: lighter text background, angled arrow after
set -g @catppuccin_window_right_separator " #[fg=#{E:@catppuccin_window_text_color},bg=#{@_ctp_status_bg}]\ue0b0 "

# active window: text merges into the bar, no arrow
set -g @catppuccin_window_current_text_color "#{@_ctp_status_bg}"
set -g @catppuccin_window_current_right_separator "   "

# session and right-hand modules: angled left edge, flat right edge
set -g @catppuccin_status_left_separator "\ue0b2"
set -g @catppuccin_status_right_separator "\ue0b6"
set -g @catppuccin_weather_text " #(~/.tmux/plugins/tmux-weather/scripts/weather.sh)"

set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_date_time}#{E:@catppuccin_status_weather}"

# Replaced the pane splitet -g mouse on
unbind '"'
unbind %

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# reload config file (change file location to your the tmux.conf you want to
# use)
bind r source-file ~/.tmux.conf

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
